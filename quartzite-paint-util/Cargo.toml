[package]
name = "quartzite-paint-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "RAII painting utilities for quartzite (no_std)"

[features]
default = ["std"]
## Enable standard-library support.
std = []

[dependencies]
quartzite-paint-api = { path = "../quartzite-paint-api", default-features = false }
quartzite-geometry  = { path = "../quartzite-geometry",  default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
