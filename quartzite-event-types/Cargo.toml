[package]
name = "quartzite-event-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core event vocabulary (Event, EventType, EventFilter, TimerEvent) for quartzite — no_std + alloc"

# No [features] — always no_std + alloc

[dependencies]
quartzite-core = { path = "../quartzite-core", default-features = false }

[dev-dependencies]
rstest            = "0.26"
pretty_assertions = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
