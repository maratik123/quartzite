[package]
name = "quartzite-style"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Style trait and StyleRegistry for quartzite (std)"

[dependencies]
quartzite-style-types = { path = "../quartzite-style-types" }
quartzite-paint        = { path = "../quartzite-paint" }
quartzite-paint-api    = { path = "../quartzite-paint-api" }
quartzite-geometry     = { path = "../quartzite-geometry" }
quartzite-widgets      = { path = "../quartzite-widgets" }
quartzite-runtime      = { path = "../quartzite-runtime", optional = true }
parking_lot            = "0.12"

[dev-dependencies]
quartzite-test-helpers = { path = "../quartzite-test-helpers" }
nv-flip                = "0.1"
image                  = "0.25"
tempfile               = "3"
peniko                 = "0.6"
quartzite-core         = { path = "../quartzite-core" }
quartzite-geometry     = { path = "../quartzite-geometry" }
quartzite-macros       = { path = "../quartzite-macros" }
quartzite-renderer     = { path = "../quartzite-renderer" }

[features]
## Drives caret blink via a `quartzite-runtime` `Timer`. Enabled by default
## so live applications get blinking carets without opt-in. No-std / runtime-less
## consumers can disable with `default-features = false`; the read-side
## `StyleClock` and `caret_visible_now` work without this feature.
runtime-blink = ["dep:quartzite-runtime"]
## Exposes `StyleRegistry::clear_for_test()` as a `pub` function for use in
## integration tests and test-helper crates that live outside `quartzite-style`.
## Enable only in `[dev-dependencies]`, never in production builds.
## Also exposes `MockTimerDriver` for blink-invalidation integration tests.
test-support = []
default = ["runtime-blink"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
