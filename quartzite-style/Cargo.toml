[package]
name = "quartzite-style"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Style trait and StyleRegistry for quartzite (std)"

[dependencies]
quartzite-style-types = { path = "../quartzite-style-types" }
quartzite-paint        = { path = "../quartzite-paint" }
quartzite-paint-api    = { path = "../quartzite-paint-api" }
quartzite-widgets      = { path = "../quartzite-widgets" }

[dev-dependencies]
serial_test        = "3"
nv-flip            = "0.1"
image              = "0.25"
tempfile           = "3"
quartzite-geometry = { path = "../quartzite-geometry" }
quartzite-renderer = { path = "../quartzite-renderer" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
