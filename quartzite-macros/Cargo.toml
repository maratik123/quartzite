[package]
name = "quartzite-macros"
version.workspace = true
edition.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"

[dev-dependencies]
quartzite-core = { path = "../quartzite-core" }
pretty_assertions = "1"
