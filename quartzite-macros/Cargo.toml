[package]
name = "quartzite-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macro crate for the quartzite GUI framework"

[lib]
proc-macro = true

[features]
## Set the global undocumented-item diagnostic level to `allow` (silent).
## If `undocumented-deny` is also active, `deny` wins (the strictest level prevails).
undocumented-allow = []
## Set the global undocumented-item diagnostic level to `deny` (hard compile error).
## Wins over `undocumented-allow` when both are active.
undocumented-deny = []

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"
proc-macro-crate = "3"

[dev-dependencies]
quartzite = { path = ".." }
trybuild = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
