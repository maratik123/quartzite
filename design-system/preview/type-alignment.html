<!doctype html>
<html><head><meta charset="utf-8"><title>Alignment grid</title>
<style>
/* Card chrome — shared by every file under /preview.
   Cards target ~700×<height>px and render the swatches / specimens
   /tokens directly with minimal decoration. */

html, body {
  margin: 0;
  padding: 0;
  background: #FFFFFF;
  color: #000000;
  font-family: 'DejaVu Sans', 'Liberation Sans', 'Helvetica Neue', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

svg { shape-rendering: geometricPrecision; }

.card {
  width: 700px;
  box-sizing: border-box;
  padding: 20px 24px;
  background: #FFFFFF;
  color: #000000;
  font-size: 12pt;
}

/* swatch primitives */
.sw-row    { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
.sw-col    { display: flex; flex-direction: column; gap: 6px; }
.sw-grid   { display: grid; gap: 12px; }
.sw        {
  width: 64px; height: 64px;
  border: 1px solid #000000;
  display: flex; align-items: center; justify-content: center;
  font-size: 10pt;
}
.sw.lg     { width: 96px; height: 96px; }
.sw.sm     { width: 48px; height: 48px; }
.sw .mono  { font-family: 'DejaVu Sans Mono', monospace; font-size: 9pt; }
.cap       { font-size: 9pt; color: #000000; letter-spacing: 0.02em; }
.mono      { font-family: 'DejaVu Sans Mono', 'Liberation Mono', Menlo, Consolas, monospace; }
.note      { font-size: 9.5pt; color: rgba(0,0,0,0.65); }
.kbd       { font-family: 'DejaVu Sans Mono', monospace; font-size: 10pt; padding: 1px 5px; border: 1px solid #000; background: #fff; }

/* meta info pair */
.kv        { display: grid; grid-template-columns: max-content 1fr; gap: 2px 16px; font-size: 10pt; }
.kv .k     { font-family: 'DejaVu Sans Mono', monospace; }
.kv .v     { font-family: 'DejaVu Sans Mono', monospace; color: rgba(0,0,0,0.7); }

/* mirrors of DefaultStyle */
.qz-button {
  background: #FFFFFF; color: #000000;
  border: 1px solid #000000; border-radius: 0;
  padding: 6px 16px;
  font: inherit; cursor: pointer; user-select: none;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 64px; min-height: 32px;
}
.qz-button.hover    { background: #F0F0F0; }                                /* HOVER_WHITE      */
.qz-button.pressed  { background: #006CD6; color: #FFFFFF; border-color: #FFFFFF; }   /* PRESSED_SKY_BLUE */
.qz-button.checked  { background: #0080FF; color: #FFFFFF; border-color: #FFFFFF; }   /* SKY_BLUE         */
.qz-button.focused  {
  /* additive 2px highlight outline over idle */
  box-shadow: inset 0 0 0 2px #0080FF;
}
.qz-button.disabled { opacity: 0.5; }

.qz-line-edit, .qz-text-edit {
  background: #FFFFFF; color: #000000;
  border: 1px solid #000000; border-radius: 0;
  padding: 4px 6px; font: inherit;
  display: inline-block;
}
.qz-line-edit { min-width: 180px; min-height: 28px; }
.qz-text-edit { min-width: 220px; min-height: 72px; white-space: pre-wrap; vertical-align: top; }
.qz-line-edit.read-only, .qz-text-edit.read-only {
  background-image: linear-gradient(rgba(255,255,255,0.5), rgba(255,255,255,0.5));
}
.qz-line-edit.placeholder { color: rgba(0,0,0,0.5); }

.qz-container, .qz-scroll-area {
  background: #FFFFFF;
  border: 1px solid #000000;
  border-radius: 0;
}
.qz-scroll-area { background: #FFFFFF; }

</style></head>
<body><div class="card" style="height:280px;">
  <div style="display:grid;grid-template-columns:repeat(3,180px);grid-template-rows:repeat(3,68px);gap:8px;">
    <!-- 9-cell grid; each cell is a Rect with text laid in at one of 9 Alignment slots -->
    <div style="border:1px solid #000;display:flex;align-items:flex-start;justify-content:flex-start;padding:6px;">TopLeft</div>
    <div style="border:1px solid #000;display:flex;align-items:flex-start;justify-content:center;padding:6px;">Top</div>
    <div style="border:1px solid #000;display:flex;align-items:flex-start;justify-content:flex-end;padding:6px;">TopRight</div>

    <div style="border:1px solid #000;display:flex;align-items:center;justify-content:flex-start;padding:6px;">Left</div>
    <div style="border:1px solid #000;display:flex;align-items:center;justify-content:center;padding:6px;">Center</div>
    <div style="border:1px solid #000;display:flex;align-items:center;justify-content:flex-end;padding:6px;">Right</div>

    <div style="border:1px solid #000;display:flex;align-items:flex-end;justify-content:flex-start;padding:6px;">BottomLeft</div>
    <div style="border:1px solid #000;display:flex;align-items:flex-end;justify-content:center;padding:6px;">Bottom</div>
    <div style="border:1px solid #000;display:flex;align-items:flex-end;justify-content:flex-end;padding:6px;">BottomRight</div>
  </div>
  <div class="note" style="margin-top:10px">
    `quartzite-geometry::Alignment`. Buttons paint with
    <span class="mono">Alignment::Center</span>; Labels &amp;
    inputs use <span class="mono">Alignment::Left</span>.
    Default is <span class="mono">Left</span>.
  </div>
</div></body></html>
