<!doctype html>
<html><head><meta charset="utf-8"><title>Dark — form components</title>
<style>
/* Card chrome — shared by every file under /preview.
   Cards target ~700×<height>px and render the swatches / specimens
   /tokens directly with minimal decoration. */

html, body {
  margin: 0;
  padding: 0;
  background: #FFFFFF;
  color: #000000;
  font-family: 'DejaVu Sans', 'Liberation Sans', 'Helvetica Neue', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

svg { shape-rendering: geometricPrecision; }

.card {
  width: 700px;
  box-sizing: border-box;
  padding: 20px 24px;
  background: #FFFFFF;
  color: #000000;
  font-size: 12pt;
}

/* swatch primitives */
.sw-row    { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
.sw-col    { display: flex; flex-direction: column; gap: 6px; }
.sw-grid   { display: grid; gap: 12px; }
.sw        {
  width: 64px; height: 64px;
  border: 1px solid #000000;
  display: flex; align-items: center; justify-content: center;
  font-size: 10pt;
}
.sw.lg     { width: 96px; height: 96px; }
.sw.sm     { width: 48px; height: 48px; }
.sw .mono  { font-family: 'DejaVu Sans Mono', monospace; font-size: 9pt; }
.cap       { font-size: 9pt; color: #000000; letter-spacing: 0.02em; }
.mono      { font-family: 'DejaVu Sans Mono', 'Liberation Mono', Menlo, Consolas, monospace; }
.note      { font-size: 9.5pt; color: rgba(0,0,0,0.65); }
.kbd       { font-family: 'DejaVu Sans Mono', monospace; font-size: 10pt; padding: 1px 5px; border: 1px solid #000; background: #fff; }

/* meta info pair */
.kv        { display: grid; grid-template-columns: max-content 1fr; gap: 2px 16px; font-size: 10pt; }
.kv .k     { font-family: 'DejaVu Sans Mono', monospace; }
.kv .v     { font-family: 'DejaVu Sans Mono', monospace; color: rgba(0,0,0,0.7); }

/* mirrors of DefaultStyle */
.qz-button {
  background: #FFFFFF; color: #000000;
  border: 1px solid #000000; border-radius: 0;
  padding: 6px 16px;
  font: inherit; cursor: pointer; user-select: none;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 64px; min-height: 32px;
}
.qz-button.hover    { background: #F0F0F0; }                                /* HOVER_WHITE      */
.qz-button.pressed  { background: #006CD6; color: #FFFFFF; border-color: #FFFFFF; }   /* PRESSED_SKY_BLUE */
.qz-button.checked  { background: #0080FF; color: #FFFFFF; border-color: #FFFFFF; }   /* SKY_BLUE         */
.qz-button.focused  {
  /* additive 2px highlight outline over idle */
  box-shadow: inset 0 0 0 2px #0080FF;
}
.qz-button.disabled { opacity: 0.5; }

.qz-line-edit, .qz-text-edit {
  background: #FFFFFF; color: #000000;
  border: 1px solid #000000; border-radius: 0;
  padding: 4px 6px; font: inherit;
  display: inline-block;
}
.qz-line-edit { min-width: 180px; min-height: 28px; }
.qz-text-edit { min-width: 220px; min-height: 72px; white-space: pre-wrap; vertical-align: top; }
.qz-line-edit.read-only, .qz-text-edit.read-only {
  background-image: linear-gradient(rgba(255,255,255,0.5), rgba(255,255,255,0.5));
}
.qz-line-edit.placeholder { color: rgba(0,0,0,0.5); }

.qz-container, .qz-scroll-area {
  background: #FFFFFF;
  border: 1px solid #000000;
  border-radius: 0;
}
.qz-scroll-area { background: #FFFFFF; }


.card.dark { background: #2B2B2B; color: #E8E8E8; }
.card.dark .sw       { border-color: #E8E8E8; color: #E8E8E8; }
.card.dark .cap      { color: #E8E8E8; }
.card.dark .note     { color: rgba(232,232,232,0.7); }
.card.dark .mono     { color: #E8E8E8; }
.card.dark .kv .k    { color: #E8E8E8; }
.card.dark .kv .v    { color: rgba(232,232,232,0.7); }
.card.dark .qz-button { background: #3C3C3C; color: #E8E8E8; border: 1px solid #E8E8E8; }
.card.dark .qz-button.hover    { background: #464646; }                                /* HOVER_ECLIPSE          */
.card.dark .qz-button.pressed  { background: #3E9EFB; color: #FFFFFF; border-color: #FFFFFF; }   /* PRESSED_DODGER_BLUE    */
.card.dark .qz-button.checked  { background: #1E90FF; color: #FFFFFF; border-color: #FFFFFF; }   /* DODGER_BLUE            */
.card.dark .qz-button.focused  { box-shadow: inset 0 0 0 2px #1E90FF; }
.card.dark .qz-button.disabled { opacity: 0.5; }
.card.dark .qz-line-edit, .card.dark .qz-text-edit { background: #1E1E1E; color: #E8E8E8; border: 1px solid #E8E8E8; }
.card.dark .qz-line-edit.read-only, .card.dark .qz-text-edit.read-only { background-image: linear-gradient(rgba(43,43,43,0.5), rgba(43,43,43,0.5)); }
.card.dark .qz-line-edit.placeholder { color: rgba(232,232,232,0.5); }
.card.dark .qz-container { background: #2B2B2B; border: 1px solid #E8E8E8; }
.card.dark .qz-scroll-area { background: #1E1E1E; border: 1px solid #E8E8E8; }
.card.dark .qz-label { background: #2B2B2B; color: #E8E8E8; }

</style></head><body>
<div class="card dark" style="height:280px;">
  <div style="display:flex;gap:22px;align-items:flex-start;">
    <div class="qz-container" style="background:#2B2B2B;border:1px solid #E8E8E8;padding:14px;display:flex;flex-direction:column;gap:10px;width:330px;">
      <div class="qz-label" style="font-weight:700;font-size:11pt;background:#2B2B2B;color:#E8E8E8;">Inside a dark Container</div>
      <span class="qz-line-edit" style="background:#1E1E1E;color:#E8E8E8;border:1px solid #E8E8E8;padding:4px 6px;display:block;">caret&nbsp;</span>
      <span class="qz-line-edit placeholder" style="background:#1E1E1E;color:rgba(232,232,232,0.5);border:1px solid #E8E8E8;padding:4px 6px;display:block;">placeholder text</span>
      <span class="qz-line-edit read-only" style="background:#1E1E1E;color:#E8E8E8;border:1px solid #E8E8E8;padding:4px 6px;display:block;background-image:linear-gradient(rgba(43,43,43,0.5),rgba(43,43,43,0.5));">read-only value</span>
      <textarea class="qz-text-edit" style="background:#1E1E1E;color:#E8E8E8;border:1px solid #E8E8E8;padding:4px 6px;height:60px;font:inherit;width:100%;box-sizing:border-box;resize:none;">Multi-line TextEdit.&#10;Base #1E1E1E + Text #E8E8E8.</textarea>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="qz-button" style="min-width:60px;">Cancel</button>
        <button class="qz-button pressed" style="min-width:60px;">OK</button>
      </div>
    </div>
    <div class="kv" style="font-size:10pt;">
      <div class="k">Base</div><div class="v">#1E1E1E</div>
      <div class="k">Text</div><div class="v">#E8E8E8</div>
      <div class="k">overlay</div><div class="v">Window×0.5α</div>
      <div class="k">focus</div><div class="v">#1E90FF 2px</div>
      <div class="k">link</div><div class="v" style="color:#5BB0FF">#5BB0FF</div>
      <div class="k">visited</div><div class="v" style="color:#C58AFF">#C58AFF</div>
      <div class="k">bright</div><div class="v" style="color:#FF6B6B">#FF6B6B</div>
    </div>
  </div>
</div>
</body></html>
