[package]
name = "quartzite-style-dispatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Widget-tree paint dispatch bridging quartzite-widgets and quartzite-style"

[dependencies]
quartzite-core      = { path = "../quartzite-core" }
quartzite-paint-api = { path = "../quartzite-paint-api", default-features = false }
quartzite-style     = { path = "../quartzite-style" }
quartzite-widgets   = { path = "../quartzite-widgets" }
tracing             = { version = "0.1", default-features = false }

[dev-dependencies]
quartzite-geometry  = { path = "../quartzite-geometry", default-features = false }
quartzite-style     = { path = "../quartzite-style", features = ["test-support"] }
serial_test         = "3"
tracing-test        = "0.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
