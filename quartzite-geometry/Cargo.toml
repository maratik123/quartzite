[package]
name = "quartzite-geometry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Geometry primitives (Point, Size, Rect, Margins) for quartzite"

[features]
## Enable standard-library support. Uses `f32::round()` and other `f32` methods directly.
std = []
## Use [`libm`](https://docs.rs/libm) for math operations when `std` is disabled.
## Recommended for `no_std` environments. Falls back to a manual implementation if neither
## `std` nor `libm` is enabled.
libm = ["dep:libm"]

[dependencies]
libm = { version = "0.2", optional = true }

[dev-dependencies]
rstest = "0.26"
pretty_assertions = "1"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
