[package]
name = "quartzite-geometry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Geometry primitives (Point, Size, Rect, Margins) for quartzite"

[features]
## Enable standard-library support. Uses `f32::round()` for float-to-integer conversions
## instead of the portable no_std fallback.
std = []

[dev-dependencies]
rstest = "0.26"
pretty_assertions = "1"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
