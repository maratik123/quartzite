[package]
name = "quartzite-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Windowed rendering backend for quartzite (vello + wgpu + winit)"

[dependencies]
quartzite-events    = { path = "../quartzite-events" }
quartzite-geometry  = { path = "../quartzite-geometry", default-features = false }
quartzite-paint-api = { path = "../quartzite-paint-api", default-features = false }
quartzite-runtime   = { path = "../quartzite-runtime" }
indexmap  = "2"
winit     = "0.30"
wgpu      = "28"
vello     = "0.8"
peniko    = "0.6"
pollster  = "0.4"
thiserror = "2"
image     = { version = "0.25", default-features = false }

[dev-dependencies]
# nothing needed yet; GPU tests are #[ignore]-gated

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
