name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Any future Rust artefact (e.g. .cargo/config.toml, clippy.toml) must be
            # added here in the same PR that introduces it to keep the matrix gate accurate.
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
              - 'rust-toolchain*'

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-stable
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build
        run: cargo build --workspace

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
      # Skip GPU snapshot tests on the default (non-GPU) test lane so its
      # runtime is unaffected. The dedicated `gpu-tests` job runs them
      # against per-OS GPU backends with the correct drivers installed.
      SKIP_RENDER_SNAPSHOT: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-stable
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Test
        run: cargo test --workspace

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-stable
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  gpu-tests:
    name: GPU tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    # Per the v1 bootstrap policy: only the Linux lane is required at PR
    # merge time. Windows/macOS lanes run but `continue-on-error: true`
    # until their per-backend goldens are bootstrapped in follow-up PRs.
    continue-on-error: ${{ !matrix.required }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
      WGPU_BACKEND: ${{ matrix.wgpu_backend }}
      WGPU_ADAPTER_NAME: ${{ matrix.wgpu_adapter_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            required: true
            wgpu_backend: vulkan
            wgpu_adapter_name: llvmpipe
          - os: windows-latest
            required: false
            wgpu_backend: dx12
            wgpu_adapter_name: Microsoft
          - os: macos-latest
            required: false
            wgpu_backend: metal
            wgpu_adapter_name: ""
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GPU stack
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools xvfb
      - name: Vulkan diagnostics
        if: runner.os == 'Linux'
        run: vulkaninfo --summary || true
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct from the `*-stable` key used by build/test/clippy/docs
          # to avoid cache thrash with the existing test job.
          shared-key: ${{ runner.os }}-stable-gpu
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Snapshot tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: cargo test -p quartzite-widgets --test snapshots
      - name: Windowed smoke test (Linux only)
        if: runner.os == 'Linux'
        # `xvfb-run` does not enforce a timeout on its inner process. If
        # the exit-on-resume logic ever regresses, the test would consume
        # the entire job quota — `timeout 60` is the hard upper bound.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: timeout 60 xvfb-run -a cargo test -p quartzite-renderer --test xvfb_smoke
      - name: Upload Xvfb log on failure
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: xvfb-log-${{ runner.os }}
          path: /tmp/.X*.log
          if-no-files-found: ignore
      - name: Upload snapshot failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-snapshot-failures-${{ runner.os }}
          path: |
            quartzite-widgets/tests/snapshots/**/*.actual.png
            quartzite-widgets/tests/snapshots/**/*.diff.png
          if-no-files-found: ignore

  features-pass:
    name: Feature matrix
    needs: [changes, features]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.features.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  build-pass:
    name: Build
    needs: [changes, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.build.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  test-pass:
    name: Test
    needs: [changes, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.test.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  clippy-pass:
    name: Clippy
    needs: [changes, clippy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.clippy.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  gpu-tests-pass:
    name: GPU tests
    needs: [changes, gpu-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.gpu-tests.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  roadmap-sync:
    name: ROADMAP sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Regenerate ROADMAP.md
        run: ./scripts/gen-roadmap.sh
      - name: Verify no drift
        run: git diff --exit-code ROADMAP.md

  roadmap-sync-pass:
    name: ROADMAP sync
    needs: roadmap-sync
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.roadmap-sync.result }}" != "success" ]]; then exit 1; fi

  docs:
    name: Docs (build)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-stable
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Docs
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings -D missing-docs"

  docs-pass:
    name: Docs
    needs: [changes, docs]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.docs.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  features:
    name: Feature matrix
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    strategy:
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features std"
          - "--no-default-features --features derive"
          - "--all-features"

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-stable-features-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build
        run: cargo build ${{ matrix.features }}

      - name: Test
        run: cargo test ${{ matrix.features }}
