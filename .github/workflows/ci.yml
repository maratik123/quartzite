name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Any future Rust artefact (e.g. .cargo/config.toml, clippy.toml) must be
            # added here in the same PR that introduces it to keep the matrix gate accurate.
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
              - 'rust-toolchain*'

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-stable
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build
        run: cargo build --workspace

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-stable
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Test
        run: cargo test --workspace

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-stable
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  features-pass:
    name: Feature matrix
    needs: [changes, features]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.features.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  build-pass:
    name: Build
    needs: [changes, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.build.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  test-pass:
    name: Test
    needs: [changes, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.test.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  clippy-pass:
    name: Clippy
    needs: [changes, clippy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.clippy.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  roadmap-sync:
    name: ROADMAP sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Regenerate ROADMAP.md
        run: ./scripts/gen-roadmap.sh
      - name: Verify no drift
        run: git diff --exit-code ROADMAP.md

  roadmap-sync-pass:
    name: ROADMAP sync
    needs: roadmap-sync
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.roadmap-sync.result }}" != "success" ]]; then exit 1; fi

  docs:
    name: Docs (build)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-stable
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Docs
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings -D missing-docs"

  docs-pass:
    name: Docs
    needs: [changes, docs]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.docs.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  features:
    name: Feature matrix
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    strategy:
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features std"
          - "--no-default-features --features derive"
          - "--all-features"

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-stable-features-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build
        run: cargo build ${{ matrix.features }}

      - name: Test
        run: cargo test ${{ matrix.features }}
