# Why master-only: Miri is 10-30x slower than native `cargo test`; running per-PR
# would impose an unacceptable latency tax. No PR-side workflow exercises an
# equivalent Miri / Tree Borrows path — this gate is the intended
# defense-in-depth surface, with findings visible via /master-ci-failed.
name: Miri (master push)

on:
  push:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    name: Miri / Tree Borrows
    runs-on: ubuntu-latest
    # v1 policy: surface Miri findings in the CI summary without turning master
    # red. Flip to `false` after a stabilisation window of Miri-clean runs is
    # tracked as a deferred follow-up to #422.
    continue-on-error: true
    env:
      # `-Zmiri-tree-borrows`: aliasing model per spec / design Round 2.
      # `-Zmiri-ignore-leaks`: `serial_test` (used by quartzite-core, runtime,
      #   style-dispatch) keys a global `scc::HashMap<String, Mutex>` by
      #   test name and never frees it — intentional, since test names live
      #   for the program's lifetime and `scc`/`sdd` use epoch-based
      #   reclamation that doesn't run at shutdown. Miri's strict-leak
      #   detector flags every such entry on test-binary exit, drowning out
      #   real findings. Tree Borrows itself remains active for UB/aliasing
      #   detection; only the leak-checker is disabled.
      # `-Zmiri-disable-isolation`: `tracing_subscriber`'s default fmt-time
      #   layer calls `SystemTime::now()` → `clock_gettime(CLOCK_REALTIME)`
      #   from inside `tracing::warn!` event formatting. Miri's default
      #   isolation mode blocks the host syscall and the std `.unwrap()` on
      #   line 107 of `std/src/sys/pal/unix/time.rs` then panics. Disabling
      #   isolation lets the syscall return the real host time; tests that
      #   warn through `tracing` (e.g. quartzite-style-dispatch's resolver-
      #   miss test) then complete. Tree Borrows itself remains active for
      #   UB/aliasing detection; only host-syscall isolation is relaxed.
      MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-ignore-leaks -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v6
      - name: Export ImageVersion  # See #340
        shell: bash
        run: |
          source "${HOME}/.bashrc" 2>/dev/null || true
          printf 'ImageVersion=%s\n' "${ImageVersion:-}" >> "${GITHUB_ENV}"
      - name: Install Rust nightly with miri + rust-src
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-05-01
          components: miri, rust-src
          cache-shared-key: ${{ runner.os }}-nightly-miri-v1-${{ env.ImageVersion }}
      - name: Verify cargo identity  # See #340
        shell: bash
        run: |
          which cargo
          cargo --version
          rustc --version
      # `setup-rust-toolchain@v1` installs `nightly-2026-05-01` and sets it as
      # the rustup override for this directory, so plain `cargo miri …` (no
      # `+nightly`) resolves to the pinned toolchain with miri + rust-src
      # already installed. The `+nightly` syntax bypasses the override and
      # asks rustup for the literal `nightly` channel alias — which the
      # pre-installed pinned toolchain does NOT register, so rustup would
      # silently download a fresh latest-nightly without the miri component
      # and fail with `'cargo-miri' is not installed`.
      - name: cargo miri setup
        run: cargo miri setup
      # The explicit -p list mirrors the FFI-free audit recorded in
      # ai-docs/plans/done/2026-05-17-miri-master-push-job.design.md and must be
      # re-audited whenever a workspace member is added or removed.
      - name: cargo miri test (FFI-free crate subset)
        run: |
          cargo miri test \
            -p quartzite-core \
            -p quartzite-geometry \
            -p quartzite-paint-api \
            -p quartzite-events \
            -p quartzite-event-types \
            -p quartzite-paint \
            -p quartzite-style-types \
            -p quartzite-style-dispatch \
            -p quartzite-runtime
      - name: cargo miri test (widgets --lib)
        run: cargo miri test --lib -p quartzite-widgets
      - name: cargo miri test (style --lib)
        run: cargo miri test --lib -p quartzite-style
      - name: cargo miri test (macros --test allow-list)
        run: |
          cargo miri test -p quartzite-macros \
            --test extend \
            --test meta_enum \
            --test object \
            --test object_impl
      - name: cargo miri test (widgets --test no_style_dep)
        run: cargo miri test -p quartzite-widgets --test no_style_dep
      - name: cargo miri test (widgets --test re_exports)
        run: cargo miri test -p quartzite-widgets --test re_exports
      - name: cargo miri test (style --test third_party_paint)
        run: cargo miri test -p quartzite-style --test third_party_paint
