name: Docs

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Export ImageVersion  # See #340
        shell: bash
        run: |
          source "${HOME}/.bashrc" 2>/dev/null || true
          printf 'ImageVersion=%s\n' "${ImageVersion:-}" >> "${GITHUB_ENV}"
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Bare shared-key (no Cargo.lock hash): the bundled cache appends
          # the parsed-lockfile hash to cacheKey internally, leaving the
          # restoreKey lockfile-agnostic — reproduces today's restore-keys
          # partial-prefix semantics. See design § Q3.
          cache-shared-key: ${{ runner.os }}-cargo-v2-${{ env.ImageVersion }}
      - name: Verify cargo identity  # See #340
        shell: bash
        run: |
          cargo --version
          rustc --version
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libfontconfig1-dev: required by parley (yeslogic-fontconfig-sys)
          sudo apt-get install -y libfontconfig1-dev
      - name: Build docs
        run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: "-D warnings -D missing-docs"
      - name: Create redirect index
        run: printf '<meta http-equiv="refresh" content="0; url=quartzite/index.html">\n' > target/doc/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
