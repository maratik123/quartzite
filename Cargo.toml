[workspace]
members = [
    "quartzite-core",
    "quartzite-macros",
    "quartzite-runtime",
    "quartzite-geometry",
    "quartzite-events",
    "quartzite-event-types",
    "quartzite-paint-api",
    "quartzite-paint",
    "quartzite-renderer",
    "quartzite-style-types",
    "quartzite-style",
    "quartzite-style-dispatch",
    "quartzite-widgets",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Marat Bukharov <marat.buharov@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/maratik123/quartzite"

[package]
name = "quartzite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A GUI and object framework for Rust"

[features]
default = ["std", "derive"]
## Enable standard-library support (threading, queued dispatch, `is_on_current_thread`).
## Disable to build in `no_std + alloc` environments (core only; runtime requires std).
std = ["quartzite-core/std", "quartzite-geometry/std", "quartzite-paint-api/std"]
## Enable proc-macro derive support (`Extend`, `Object`, `object_impl`, `MetaEnum`).
## Disable to reduce compile time in macro-free or `no_std` builds.
derive = ["dep:quartzite-macros"]
## Enable `libm`-based float support for `no_std + alloc` environments.
## Required when `std` is disabled. Enables float math in `quartzite-paint-api`.
libm = ["quartzite-paint-api/libm"]
## Enable the built-in widget system (`quartzite-widgets` crate).
widgets = ["dep:quartzite-widgets"]
## Enable snapshot serialization/deserialization (`serde` + `typetag` in `quartzite-core`).
serde = ["quartzite-core/serde", "quartzite-runtime/serde"]
## Enable the styling layer (`quartzite-style` crate).
##
## When enabled, `quartzite::style` re-exports the `Style` trait, `StyleRegistry`,
## `Palette`, and `ColorRole` (the latter two surface from the upstream
## `quartzite-style-types` leaf via `quartzite-style`'s own re-export) for
## one-stop styling-vocabulary access.
style = ["dep:quartzite-style"]

#! ### Diagnostic features
#!
#! Off by default. Enabling these is purely additive and only affects observability,
#! never correctness or behaviour.

## Enable span instrumentation on high-frequency paths (e.g. signal emit, event loop post).
## Off by default to keep hot paths zero-cost.
verbose-tracing = ["quartzite-core/verbose-tracing", "quartzite-runtime/verbose-tracing"]

[dependencies]
quartzite-core         = { path = "quartzite-core", default-features = false }
quartzite-macros       = { path = "quartzite-macros", optional = true }
quartzite-runtime      = { path = "quartzite-runtime" }
quartzite-geometry     = { path = "quartzite-geometry", default-features = false }
quartzite-events       = { path = "quartzite-events", default-features = false }
quartzite-paint-api    = { path = "quartzite-paint-api", default-features = false }
quartzite-paint        = { path = "quartzite-paint" }
quartzite-style        = { path = "quartzite-style", optional = true }
quartzite-widgets      = { path = "quartzite-widgets", optional = true }
document-features      = "0.2"

[[example]]
name = "hello_object"
required-features = ["derive"]

[[example]]
name = "signals_slots"
required-features = ["derive"]

[[example]]
name = "object_tree"
required-features = ["derive"]

[[example]]
name = "timer"
required-features = ["std", "derive"]

[[example]]
name = "emit_macro"
required-features = ["derive"]

[[example]]
name = "combined"
required-features = ["derive"]

[[test]]
name = "single_dep"
required-features = ["derive"]

[[test]]
name = "signal_to_signal"
required-features = ["std", "derive"]

[dev-dependencies]
criterion = "0.8"
env_logger = "0.11"
serial_test = "3"

[[bench]]
name = "macro_object"
harness = false
required-features = ["derive"]

[package.metadata.docs.rs]
no-default-features = true
features = ["std", "derive", "widgets", "serde", "style", "verbose-tracing"]
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
