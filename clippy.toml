# clippy::doc_markdown false-positive allowlist.
#
# Project policy: Rust identifiers (project types, third-party types,
# build-config tokens like `no_std`) MUST be backticked in prose — they are
# code references, and the lint correctly flags missing backticks. This
# allowlist is reserved for genuine non-code tokens that the heuristic
# mistakes for identifiers: acronyms, brand names, proper nouns.
#
# Clippy ships its own default allowlist covering: storage units (`KiB`,
# `MiB`, …), frequencies (`MHz`, `GHz`), Apple frameworks (`CoreFoundation`,
# …), Microsoft (`DirectX`, `PowerShell`, …), the OpenGL family (`OpenGL`,
# `WebGL`, `WebGPU`, …), web/JS langs (`JavaScript`, `TypeScript`, …),
# operating systems (`iOS`, `macOS`, `FreeBSD`, …), typesetting (`TeX`,
# `LaTeX`, …), `IPv4`/`IPv6`, `OAuth`, `GraphQL`, `NaN`, `CamelCase`, etc.
# Defaults do NOT cover plain `GPU`, nor common networking acronyms like
# `JSON`/`HTTP`/`URL` — add those here only if/when they actually appear in
# our prose.
#
# Reference: https://doc.rust-lang.org/clippy/lint_configuration.html#doc-valid-idents
doc-valid-idents = [
    # Extends the default list — does NOT replace it.
    # Acronyms / brand names that we use in prose and are not in the defaults.
    "GPU",
]
