[features]
## Enable span instrumentation on high-frequency paths (e.g. signal emit, event loop post).
## Off by default to keep hot paths zero-cost.
verbose-tracing = ["quartzite-core/verbose-tracing"]
## Enable snapshot capture/restore functions. Forwards to `quartzite-core/serde`.
serde = ["quartzite-core/serde"]

[package]
name = "quartzite-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Application runtime, event loop, and object tree for quartzite"

[dependencies]
parking_lot           = "0.12"
quartzite-core        = { path = "../quartzite-core" }
quartzite-event-types = { path = "../quartzite-event-types" }
quartzite-macros      = { path = "../quartzite-macros" }
slotmap               = "1"
thiserror             = "2"
tracing               = { version = "0.1", features = ["log"] }

[dev-dependencies]
env_logger = "0.11"
itertools = "0.14"
criterion = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
quartzite-test-helpers = { path = "../quartzite-test-helpers" }
typetag = "0.2"

[[bench]]
name = "object_tree"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
