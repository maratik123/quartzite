[package]
name = "quartzite-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core object model, signals, properties, and value types for quartzite"

[features]
default = ["std"]
## Enable standard-library support (threading, queued dispatch, `is_on_current_thread`).
## Disable to build in `no_std + alloc` environments.
std = ["indexmap/std", "tracing/log", "dep:parking_lot"]

#! ### Serialization features

## Enable `serde::Serialize` / `serde::Deserialize` on `Value`, `WeakObjectRef`,
## `ObjectSnapshot`, and `TreeSnapshot`. Pulls in `serde` (alloc-only, no std
## required) and `typetag` for `Value::Custom` round-trip. Off by default.
serde = ["dep:serde", "dep:typetag"]

#! ### Diagnostic features
#!
#! Off by default. Enabling these is purely additive and only affects observability,
#! never correctness or behaviour.

## Enable span instrumentation on high-frequency paths (e.g. signal emit).
## Off by default to keep hot paths zero-cost.
verbose-tracing = []

[dependencies]
parking_lot = { version = "0.12", optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
typetag = { version = "0.2", optional = true }
document-features = "0.2"
enumflags2 = "0.7"
indexmap = { version = "2", default-features = false }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
rstest = "0.26"
serial_test = "3"
itertools = "0.14"
criterion = "0.8"
serde_json = "1"
bincode = { version = "2", features = ["serde"] }

[[bench]]
name = "signal_property"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
